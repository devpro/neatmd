runner:
  image: ghcr.io/devpro/ubuntu-node:latest
  sonarqube:
    gate: true
    profile: Sonar way comprehensive
    projects:
      - neatmd

workflow:
  onDisallowedAction: fail
  allowedActions:
    - actions/*
    - github/*
    - devpro/github-workflow-parts/*
  exclude:
    - pkg.yml

vars:
  SONAR_ORG: local
  SONAR_PROJECT_KEY: neatmd
