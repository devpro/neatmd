sonar.sources=bin,src
sonar.tests=tests
sonar.test.inclusions=tests/*.test.js
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.issue.ignore.multicriteria=path,config,inlineRuntime,inline
# The command runs the git installed on the machine, whose location differs from one machine to another, with the access rights of the user.
sonar.issue.ignore.multicriteria.path.ruleKey=javascript:S4036
sonar.issue.ignore.multicriteria.path.resourceKey=src/processor.js
# The pattern reads the section names of an .editorconfig file, which are short and belong to the repository being formatted.
sonar.issue.ignore.multicriteria.config.ruleKey=javascript:S8786
sonar.issue.ignore.multicriteria.config.resourceKey=src/config.js
# The link pattern reads one line at a time, of files the user chose to format, and a line of 24,000 characters written to slow it takes about a second.
sonar.issue.ignore.multicriteria.inlineRuntime.ruleKey=javascript:S8786
sonar.issue.ignore.multicriteria.inlineRuntime.resourceKey=src/formatter.js
# The patterns of links and of inline spans follow the nesting of Markdown, and one span has to be consumed before the next is looked for, which separate patterns would not do.
sonar.issue.ignore.multicriteria.inline.ruleKey=javascript:S5843
sonar.issue.ignore.multicriteria.inline.resourceKey=src/formatter.js
