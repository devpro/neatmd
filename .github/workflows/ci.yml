name: CI
# title: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: "${{ github.ref }}-ci"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  markup-lint:
    name: Markup
    uses: devpro/github-workflow-parts/.github/workflows/reusable-markup-lint.yml@5379b9d0052e3b233ec2e56ba8678e827361b89e

  test:
    name: "Test"
    uses: devpro/github-workflow-parts/.github/workflows/reusable-node-quality.yml@5379b9d0052e3b233ec2e56ba8678e827361b89e
    with:
      # neatmd checks its own Markdown, its fixtures of malformed input left out.
      custom-tests: |
        rm -rf tests/fixtures/*.in.md
        node bin/cli.js --check .
      job-name: Test
      workflow-parts-version: 5379b9d0052e3b233ec2e56ba8678e827361b89e
