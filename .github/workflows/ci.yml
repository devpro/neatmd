name: CI
# title: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: "${{ github.ref }}-ci"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  markup-lint:
    name: Markup
    uses: devpro/github-workflow-parts/.github/workflows/reusable-markup-lint.yml@8c856cd16adc8a0ca01c7889a9c7d98ad8593818

  test:
    name: "Test"
    uses: devpro/github-workflow-parts/.github/workflows/reusable-node-quality.yml@8c856cd16adc8a0ca01c7889a9c7d98ad8593818
    with:
      # neatmd checks its own Markdown, its fixtures of malformed input left out.
      custom-tests: |
        rm -rf tests/fixtures/*.in.md
        node bin/cli.js --check .
      job-name: Test
      workflow-parts-version: 8c856cd16adc8a0ca01c7889a9c7d98ad8593818
