name: CI
# title: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: "${{ github.ref }}-ci"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  content-validate:
    name: Markup
    uses: devpro/github-workflow-parts/.github/workflows/reusable-markup-lint.yml@13ac7ccf4ba593797f8c80a75f2559ce0fc2d09e

  test:
    name: "Test"
    uses: devpro/github-workflow-parts/.github/workflows/reusable-node-quality.yml@13ac7ccf4ba593797f8c80a75f2559ce0fc2d09e
    with:
      # neatmd checks its own Markdown, its fixtures of malformed input left out.
      custom-tests: |
        rm -rf tests/fixtures/*.in.md
        node bin/cli.js --check .
      job-name: Test
      workflow-parts-version: 13ac7ccf4ba593797f8c80a75f2559ce0fc2d09e
