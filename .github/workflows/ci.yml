name: CI
# title: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: "${{ github.ref }}-ci"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  content-validate:
    name: Markup
    uses: devpro/github-workflow-parts/.github/workflows/reusable-markup-lint.yml@f9e473710e83b91ff0f594476ca4e6bc0954e1f9

  test:
    name: "Test"
    uses: devpro/github-workflow-parts/.github/workflows/reusable-node-quality.yml@f9e473710e83b91ff0f594476ca4e6bc0954e1f9
    with:
      # neatmd checks its own Markdown, its fixtures of malformed input left out.
      custom-tests: |
        rm -rf tests/fixtures/*.in.md
        node bin/cli.js --check .
      job-name: Test
      workflow-parts-version: f9e473710e83b91ff0f594476ca4e6bc0954e1f9
