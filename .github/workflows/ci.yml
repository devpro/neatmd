name: CI
# title: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: "${{ github.ref }}-ci"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  markup-lint:
    name: Markup
    uses: devpro/github-workflow-parts/.github/workflows/reusable-markup-lint.yml@591b0c7bfba6fbc7b0cab7d896447e0732b819de

  test:
    name: "Test"
    uses: devpro/github-workflow-parts/.github/workflows/reusable-node-quality.yml@591b0c7bfba6fbc7b0cab7d896447e0732b819de
    with:
      # neatmd checks its own Markdown, its fixtures of malformed input left out.
      custom-tests: |
        rm -rf tests/fixtures/*.in.md
        node bin/cli.js --check .
      job-name: Test
      workflow-parts-version: 591b0c7bfba6fbc7b0cab7d896447e0732b819de
