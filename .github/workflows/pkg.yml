name: PKG

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: "${{ github.ref }}-pkg"
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: "Publish"
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      # npm trusted publishing: the package is published with a short-lived OIDC token rather than a stored secret.
      - name: Publish to npm
        uses: devpro/github-workflow-parts/actions/npm/publish@c6d06a61a377a41dc192ce58f08a0b5100d9a2bc
