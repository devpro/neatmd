name: PKG

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: "${{ github.ref }}-pkg"
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: "Publish"
    permissions:
      contents: read
      # npm trusted publishing: the package is published with a short-lived OIDC token rather than a stored secret.
      id-token: write
    uses: devpro/github-workflow-parts/.github/workflows/reusable-npm-publication.yml@591b0c7bfba6fbc7b0cab7d896447e0732b819de
    with:
      job-name: Publish
      workflow-parts-version: 591b0c7bfba6fbc7b0cab7d896447e0732b819de
