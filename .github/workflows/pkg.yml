name: PKG

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: "${{ github.ref }}-pkg"
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: "Publish"
    permissions:
      contents: read
      # npm trusted publishing: the package is published with a short-lived OIDC token rather than a stored secret.
      id-token: write
    uses: devpro/github-workflow-parts/.github/workflows/reusable-npm-publication.yml@f9e473710e83b91ff0f594476ca4e6bc0954e1f9
    with:
      job-name: Publish
      workflow-parts-version: f9e473710e83b91ff0f594476ca4e6bc0954e1f9
